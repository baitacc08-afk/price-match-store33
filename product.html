<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details | EMS Auto Parts</title>

  <meta
    name="description"
    content="Browse automotive products at EMS Auto Parts. View product details and add items to your shopping cart."
  >

  <link rel="stylesheet" href="./styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    /* HEADER — MATCHES THE OTHER EMS PAGES */
    header {
      background: #111;
      color: white;
      padding: 22px 20px;
      text-align: center;
      border-bottom: 4px solid #ff6600;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      margin: 5px 0 0;
      color: #ff6600;
      font-weight: bold;
      letter-spacing: 1px;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    /* PRODUCT PAGE LAYOUT */
    .detail-page {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .detail-breadcrumb {
      margin-bottom: 24px;
      font-size: 14px;
    }

    .detail-breadcrumb a {
      color: inherit;
      text-decoration: none;
    }

    .detail-breadcrumb a:hover {
      text-decoration: underline;
    }

    .detail-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 36px;
      align-items: start;
      padding: 28px;
      border: 1px solid var(--border-color, #ddd);
      border-radius: 12px;
      background: var(--card-background, #fff);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .detail-product-visual {
      min-width: 0;
    }

    .detail-image-container {
      display: grid;
      place-items: center;
      min-height: 300px;
      padding: 20px;
      border-radius: 10px;
      background: #f7f7f7;
    }

    .detail-image {
      display: block;
      width: 100%;
      max-height: 430px;
      object-fit: contain;
    }

    .detail-image-fallback {
      display: none;
      text-align: center;
      color: #666;
      padding: 30px;
    }

    .detail-product-information {
      min-width: 0;
    }

    .detail-category {
      margin: 0 0 12px;
      color: #666;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }

    .detail-title {
      margin: 0 0 18px;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .detail-brand,
    .detail-sku,
    .detail-description {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .detail-description h2 {
      font-size: 20px;
    }

    .detail-price {
      margin: 24px 0 8px;
      font-size: 28px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .detail-price-note {
      margin: 0 0 24px;
      font-size: 13px;
      color: #666;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .detail-actions a,
    .detail-actions button {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .detail-add-to-cart-button {
      padding: 14px 22px;
      border: 2px solid #000;
      border-radius: 8px;
      background: #000;
      color: #fff;
      font-weight: 700;
    }

    .detail-add-to-cart-button:hover {
      border-color: #222;
      background: #222;
      color: #fff;
    }

    .detail-retailer-button {
      background: var(--primary-color, #d71920);
      color: #fff !important;
    }

    .detail-retailer-button:hover {
      filter: brightness(0.9);
    }

    .detail-add-to-cart-button:focus-visible,
    .detail-back-button:focus-visible {
      outline: 3px solid #777;
      outline-offset: 3px;
    }

    .detail-add-to-cart-button:disabled {
      opacity: 0.75;
      cursor: default;
    }

    .detail-back-button {
      display: inline-block;
      padding: 14px 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .detail-back-button:hover {
      background: rgba(127, 127, 127, 0.1);
    }

    .detail-status {
      padding: 40px 20px;
      text-align: center;
      line-height: 1.7;
    }

    .detail-status h1 {
      margin-bottom: 12px;
    }

    .detail-status a {
      display: inline-block;
      margin-top: 14px;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 700px) {
      .detail-page {
        margin: 24px auto;
      }

      .detail-panel {
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
        padding: 18px;
      }

      .detail-image-container {
        min-height: 220px;
      }

      .detail-title {
        font-size: 24px;
      }

      .detail-actions {
        flex-direction: column;
      }

      .detail-actions a,
      .detail-actions button {
        width: 100%;
        box-sizing: border-box;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 12px;
      }

      header h1 {
        font-size: 25px;
      }

      header p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER: MATCHES THE OTHER EMS AUTO PARTS PAGES -->
  <header>
    <a href="./index.html" aria-label="EMS Auto Parts home">
      <h1>EMS AUTO PARTS</h1>
      <p>QUALITY PARTS. BETTER PRICES.</p>
    </a>
  </header>

  <!-- ORIGINAL PRODUCT PAGE LAYOUT -->
  <main class="detail-page">

    <nav class="detail-breadcrumb" aria-label="Breadcrumb">
      <a href="./index.html">Home</a>
      <span aria-hidden="true"> / </span>
      <span>Product details</span>
    </nav>

    <section id="product-detail" aria-live="polite">
      <div class="detail-status">
        <h1>Loading product...</h1>
        <p>Please wait while the product information loads.</p>
      </div>
    </section>

  </main>

  <!-- KEEP EXISTING PRODUCT FUNCTIONALITY -->
  <script src="./product.js" defer></script>

</body>
</html>
