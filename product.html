<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Product Details | EMS Auto Parts</title>
  <meta name="description" content="View product details at EMS Auto Parts. Quality parts. Better prices.">

  <link rel="stylesheet" href="./styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    /* HEADER — MATCHES THE OTHER EMS PAGES */
    header {
      background: #111;
      color: white;
      padding: 22px 20px;
      text-align: center;
      border-bottom: 4px solid #ff6600;
    }

    header a {
      display: inline-block;
      color: white;
      text-decoration: none;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      margin: 5px 0 0;
      color: #ff6600;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* NAVIGATION — MATCHES THE OTHER EMS PAGES */
    nav {
      background: #222;
      padding: 14px 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      color: #ff6600;
    }

    /* MAIN CONTENT */
    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 50px;
      min-height: 60vh;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #e65c00;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #product-detail {
      width: 100%;
    }

    /* General product detail styling */
    #product-detail img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    #product-detail button,
    #product-detail .button,
    #product-detail a.button {
      cursor: pointer;
    }

    .page-heading {
      margin: 0 0 8px;
      font-size: 28px;
      color: #111;
    }

    .page-description {
      margin: 0 0 25px;
      color: #666;
    }

    /* FOOTER — MATCHES THE OTHER EMS PAGES */
    footer {
      background: #111;
      color: #ccc;
      text-align: center;
      padding: 25px 15px;
      border-top: 4px solid #ff6600;
      margin-top: 30px;
    }

    footer p {
      margin: 5px 0;
      font-size: 14px;
    }

    footer a {
      color: #ff6600;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* MOBILE LAYOUT */
    @media (max-width: 600px) {
      header {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 25px;
      }

      header p {
        font-size: 12px;
      }

      nav {
        gap: 12px 18px;
        padding: 14px 8px;
      }

      nav a {
        font-size: 13px;
      }

      main {
        padding: 22px 14px 35px;
      }

      .page-heading {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- EMS AUTO PARTS HEADER -->
  <header>
    <a href="./index.html" aria-label="EMS Auto Parts home">
      <h1>EMS AUTO PARTS</h1>
      <p>QUALITY PARTS. BETTER PRICES.</p>
    </a>
  </header>

  <!-- MAIN NAVIGATION -->
  <nav aria-label="Main navigation">
    <a href="./index.html">Home</a>
    <a href="./about.html">About Us</a>
    <a href="./cart.html">Cart</a>
    <a href="./legal.html">Legal &amp; Information</a>
  </nav>

  <!-- PRODUCT CONTENT -->
  <main>
    <a class="back-link" href="./index.html">&larr; Back to products</a>

    <div id="product-detail">
      <p>Loading product details...</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p><strong>EMS AUTO PARTS</strong></p>
    <p>QUALITY PARTS. BETTER PRICES.</p>
    <p>
      <a href="./index.html">Home</a> |
      <a href="./about.html">About Us</a> |
      <a href="./cart.html">Cart</a> |
      <a href="./legal.html">Legal &amp; Information</a>
    </p>
    <p>&copy; <span id="current-year"></span> EMS Auto Parts. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>

  <!-- KEEP THE EXISTING PRODUCT SCRIPT -->
  <script src="./product.js" defer></script>

</body>
</html>
