<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | EMS Auto Parts</title>

  <meta
    name="description"
    content="View automotive product details at EMS Auto Parts."
  >

  <meta name="theme-color" content="#111111">

  <link rel="stylesheet" href="styles.css">
</head>

<body class="product-page">

  <header class="header">
    <a class="logo" href="index.html" aria-label="EMS Auto Parts home">
      <span class="logo-ems">EMS</span>
      <span class="logo-auto">AUTO PARTS</span>
    </a>

    <div class="header-tagline">
      QUALITY PARTS. BETTER PRICES.
    </div>

    <nav class="header-nav" aria-label="Main navigation">
      <a class="header-nav-link" href="index.html">Catalogue</a>
      <a class="header-nav-link" href="about.html">About Us</a>
    </nav>
  </header>

  <main class="product-detail-main">

    <nav class="product-breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <span>Product Details</span>
    </nav>

    <div id="product-detail" aria-live="polite">
      <div class="product-detail-loading">
        Loading product details...
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="footer-brand">
      <span class="footer-ems">EMS</span>
      <span class="footer-auto">AUTO PARTS</span>
    </div>

    <p class="footer-tagline">
      QUALITY PARTS. BETTER PRICES.
    </p>

    <p class="footer-copyright">
      &copy; 2026 EMS Auto Parts. All rights reserved.
    </p>

    <div class="footer-legal-links">
      <a href="legal.html">Legal &amp; Information</a>
    </div>
  </footer>

  <script src="product.js"></script>

</body>
</html>
